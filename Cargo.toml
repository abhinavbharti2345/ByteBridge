[workspace]
resolver = "2"
members = [
    "crates/bytebridge-core",
    "crates/bytebridge-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ByteBridge Contributors"]
license = "MIT"
repository = "https://github.com/Win-Projects/ByteBridge"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
sha2 = "0.10"
blake3 = "1.5"
snow = "0.9"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
