# Configuration for cargo-deny

[advisories]
# RustSec Advisory Database settings
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[licenses]
# Disallow copyleft licenses that may force source disclosure or violate proprietary boundaries
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Prevent crate bloat and duplicate major version dependencies
multiple-versions = "warn"
deny = [
    # Prohibit unverified custom crypto or known problematic crates
    { name = "md5" },
    { name = "sha1" },
    { name = "rc4" },
]

[sources]
# Strictly require dependencies to originate from crates.io or local workspace paths
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
